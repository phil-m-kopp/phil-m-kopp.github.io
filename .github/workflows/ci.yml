name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ hashFiles('requirements.txt') }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: python -m pip install -r requirements.txt
      # - run: python3 convertWebP.py
      # - run: mkdocs build -d build
      # - run: echo "philipp-kopp.com" > build/CNAME
      - run: mkdocs gh-deploy --force
